<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>学校給食 材料表</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  </head>
  <body>
    <main class="container">
      <header>
        <p class="eyebrow">SCHOOL LUNCH</p>
        <h1>学校給食 材料表</h1>
        <p class="lead">給食のPDFをアップロードすると、日にち・メニュー・材料を一覧表示します。</p>
      </header>

      <section class="upload-card" aria-labelledby="upload-title">
        <h2 id="upload-title">PDFを読み込む</h2>
        <label class="drop-zone" id="drop-zone" for="pdf-input">
          <span class="drop-icon" aria-hidden="true">↑</span>
          <span><strong>PDFを選択</strong> またはここにドラッグ＆ドロップ</span>
          <small>PDF形式・最大20MB</small>
          <input id="pdf-input" type="file" accept="application/pdf" />
        </label>
        <div class="progress-area" aria-live="polite">
          <p id="status">PDFを選択してください。</p>
          <progress id="progress" max="100" value="0" hidden></progress>
        </div>
      </section>

      <section id="result-section" hidden aria-labelledby="result-title">
        <label class="allergen-select-label" for="allergen-select">材料の選択</label>
        <select id="allergen-select" class="allergen-select" multiple size="4" aria-label="アレルギー確認対象の材料">
          <option value="milk" selected>牛乳・乳製品</option>
          <option value="wheat" selected>小麦</option>
          <option value="egg" selected>卵</option>
          <option value="shrimp" selected>えび</option>
          <option value="crab" selected>かに</option>
          <option value="buckwheat" selected>そば</option>
          <option value="peanut" selected>落花生</option>
          <option value="walnut" selected>くるみ</option>
          <option value="soy" selected>大豆</option>
        </select>
        <button id="allergen-button" class="allergen-button" type="button" aria-pressed="false">
          アレルギーチェック
        </button>
        <div class="result-heading">
          <div>
            <p class="eyebrow">RESULT</p>
            <h2 id="result-title">給食一覧</h2>
          </div>
          <button id="clear-button" class="secondary-button" type="button">クリア</button>
        </div>
        <p id="result-note" class="result-note"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>日にち</th><th>メニュー</th><th>材料</th></tr>
            </thead>
            <tbody id="results"></tbody>
          </table>
        </div>
      </section>

      <section class="upload-card plating-section" aria-labelledby="plating-title">
        <h2 id="plating-title">盛り付け表PDFを読み込む</h2>
        <label class="drop-zone" id="plating-drop-zone" for="plating-input">
          <span class="drop-icon" aria-hidden="true">↑</span>
          <span><strong>PDFを選択</strong> またはここにドラッグ＆ドロップ</span>
          <small>PDF形式・最大20MB</small>
          <input id="plating-input" type="file" accept="application/pdf" />
        </label>
        <p id="plating-status" class="progress-area">盛り付け表PDFを選択してください。</p>
        <div id="plating-result" hidden>
          <div id="plating-pages" class="plating-pages"></div>
        </div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
